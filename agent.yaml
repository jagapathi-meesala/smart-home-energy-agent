spec_version: "0.1.0"
name: "smart-home-energy-agent"
version: "1.0.0"
agent:
  name: "smart-home-energy-agent"
  id: "smart-home-energy-agent-01"
  version: "1.0.0"
  description: "A framework-independent, portable AI agent for smart home energy consumption analysis, pattern detection, anomaly detection, cost estimation, recommendations, and reporting."
  author: "HiDevs x Lyzr"

capabilities:
  - name: "energy_consumption_analysis"
    description: "Analyze generic energy-consumption records for peak, average, minimum, total, and distribution metrics."
  - name: "appliance_energy_analysis"
    description: "Analyze energy consumption broken down by device or appliance categories."
  - name: "energy_pattern_detection"
    description: "Detect hourly, daily, and weekday vs weekend energy usage patterns."
  - name: "energy_anomaly_detection"
    description: "Identify unusual energy consumption records using deterministic statistical methods."
  - name: "energy_cost_estimation"
    description: "Estimate electricity cost based on consumption kWh and tariff rates."
  - name: "energy_saving_recommendation"
    description: "Generate analytical energy-saving recommendations based on usage patterns and anomalies."
  - name: "energy_reporting"
    description: "Synthesize complete structured JSON energy reports containing statistics, breakdowns, anomalies, cost, and recommendations."

tools:
  - name: "energy_consumption_analyzer_tool"
    description: "Tool to compute energy metrics, distributions, and summary statistics from records."
    capability: "energy_consumption_analysis"
  - name: "appliance_energy_analyzer_tool"
    description: "Tool to calculate category/appliance level consumption breakdown and statistics."
    capability: "appliance_energy_analysis"
  - name: "energy_pattern_detector_tool"
    description: "Tool to analyze temporal distribution and identify usage patterns across hours and days."
    capability: "energy_pattern_detection"
  - name: "energy_anomaly_detector_tool"
    description: "Tool to detect consumption anomalies with statistical scoring and explicit explanations."
    capability: "energy_anomaly_detection"
  - name: "energy_cost_estimator_tool"
    description: "Tool to calculate financial cost from kWh energy consumption and tariffs."
    capability: "energy_cost_estimation"
  - name: "energy_recommendation_tool"
    description: "Tool to derive analytical energy efficiency suggestions with safety disclaimers."
    capability: "energy_saving_recommendation"
  - name: "energy_report_tool"
    description: "Tool to assemble comprehensive structured energy reports."
    capability: "energy_reporting"

passport:
  trust_level: "local_verified"
  portability: "framework_independent"
  execution_mode: "offline_deterministic"
